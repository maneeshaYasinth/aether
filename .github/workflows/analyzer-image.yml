name: analyzer-image

# Build the ai-analyzer image on every change to it. Pull requests only build
# (proves the Dockerfile still works); pushes to main also publish to GHCR.
on:
  push:
    branches: [main]
    paths:
      - "ai-analyzer/**"
      - ".github/workflows/analyzer-image.yml"
  pull_request:
    paths:
      - "ai-analyzer/**"
      - ".github/workflows/analyzer-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # GHCR image names must be lowercase.
  IMAGE: ghcr.io/maneeshayasinth/aether-analyzer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # sha-<short> pins an exact build for the CronJob; latest is for manual testing.
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ai-analyzer
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
