apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-analyzer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/maneeshaYasinth/aether.git
    targetRevision: main
    path: gitops/charts/ai-analyzer
  destination:
    server: https://kubernetes.default.svc
    namespace: aether-analyzer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
